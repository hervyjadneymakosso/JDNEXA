<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1458d4"><meta name="description" content="Découvrez le catalogue de cette boutique sur JDNEXA."><title>Boutique — JDNEXA</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body class="storefront-body">
<header class="topbar storefront-nav"><a class="brand" href="index.html"><span class="brand-mark">J</span> JDNEXA</a><span class="storefront-tag">CATALOGUE EN LIGNE</span><a class="btn btn-light" href="index.html">Créer un site</a></header>
<main class="storefront wrap">
<section class="storefront-hero"><div class="storefront-logo" data-shop-logo>J</div><div><span class="eyebrow">BOUTIQUE EN LIGNE</span><h1 data-shop-name>Chargement de la boutique…</h1><p data-shop-description class="muted"></p><div class="storefront-contact" data-shop-contact></div></div></section>
<div class="storefront-toolbar"><div><h2>Notre catalogue</h2><p class="muted">Parcourez les articles disponibles et contactez directement la boutique.</p></div><input type="search" id="product-search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit"></div>
<div class="storefront-products" data-products><div class="empty">Chargement du catalogue…</div></div>
</main>
<footer class="footer"><div class="wrap footer-inner"><a class="brand" href="index.html"><span class="brand-mark">J</span> JDNEXA</a><small>Catalogue propulsé par JDNEXA — JDN Agency</small></div></footer>
<div class="store-modal" data-order-modal hidden><div class="store-modal-card"><button class="store-modal-close" type="button" data-close-order aria-label="Fermer">×</button><span class="eyebrow">DEMANDE DE COMMANDE</span><h2 data-order-title>Commander</h2><form data-order-form><input type="hidden" name="product_id"><input type="hidden" name="product_title"><div class="field"><label>Votre nom</label><input name="nom_client" required minlength="2" maxlength="100"></div><div class="field"><label>Votre téléphone</label><input name="telephone" required minlength="6" maxlength="40"></div><div class="field"><label>Quantité</label><input name="quantite" type="number" min="1" max="99" value="1" required></div><div class="field"><label>Précisions (facultatif)</label><textarea name="message" maxlength="500"></textarea></div><button class="btn btn-primary" type="submit">Envoyer la demande</button><p data-order-status aria-live="polite"></p></form></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="boutique.js"></script></body></html>
