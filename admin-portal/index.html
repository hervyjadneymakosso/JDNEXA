<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a33"><title>Connexion — JDNEXA ADMIN</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-body"><main class="login-shell"><a class="brand" href="index.html"><span class="brand-mark">J</span><span>JDNEXA <small>ADMIN</small></span></a><section class="login-card"><span class="eyebrow">ESPACE PRIVÉ DE GESTION</span><h1>Administration</h1><p class="muted">Connectez-vous avec votre compte administrateur JDNEXA.</p><form id="login-form"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary full" id="login-btn">Se connecter</button><p id="login-message" class="message" role="status"></p></form><p class="security-note">Accès réservé aux comptes autorisés par JDNEXA.</p></section><footer>JDNEXA ADMIN · JDN Agency</footer></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
(()=>{const form=document.querySelector("#login-form"),msg=document.querySelector("#login-message"),btn=document.querySelector("#login-btn");let sb;try{sb=window.requireSupabase()}catch(e){msg.textContent=e.message;return}
async function route(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data,error}=await sb.auth.getUser();if(!error&&data.user?.app_metadata?.role==="admin")location.replace("admin.html");else if(data.user){await sb.auth.signOut();msg.textContent="Ce compte ne possède pas les droits administrateur.";}}
route();window.addEventListener("pageshow",route);
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Vérification…";btn.disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:form.email.value.trim(),password:form.password.value});if(error)throw error;const {data,error:ue}=await sb.auth.getUser();if(ue)throw ue;if(data.user?.app_metadata?.role!=="admin"){await sb.auth.signOut();throw Error("Accès refusé : ce compte n'est pas administrateur.");}location.replace("admin.html");}catch(err){msg.textContent=err.message||"Connexion impossible.";btn.disabled=false;}});
})();</script></body></html>
