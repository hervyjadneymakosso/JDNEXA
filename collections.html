<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections — JDNEXA</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div class="app-layout"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">J</span> JDNEXA</a><a class="side-link" href="dashboard.html">⌂ Tableau de bord</a><a class="side-link active" href="collections.html">▤ Collections</a></aside><main class="app-main"><h1 class="page-title">Collections de données</h1><p class="muted">Produits, articles, annonces et profils rattachés à un site.</p><section class="panel"><form data-collection-form><input type="hidden" name="item_id"><div class="field"><label>Type de contenu</label><select name="type_donnee" required><option value="produit">Produit</option><option value="article">Article</option><option value="annonce">Annonce</option><option value="profil_rencontre">Profil de rencontre</option></select></div><div class="field"><label>Titre</label><input name="titre" required maxlength="140"></div><div class="field"><label>Description</label><textarea name="description" maxlength="5000"></textarea></div><div class="field"><label>Prix (facultatif)</label><input name="prix" type="number" min="0" step="1"></div><button class="btn btn-primary" type="submit">Enregistrer le contenu</button><p data-message class="error" aria-live="polite"></p></form></section><section style="margin-top:24px"><h2>Contenus enregistrés</h2><div data-collection-list class="data-list"><div class="empty">Chargement…</div></div></section></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="collections.js"></script></body></html>
