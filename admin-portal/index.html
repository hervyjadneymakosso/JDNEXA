<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a33"><title>Connexion — JDNEXA ADMIN</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-body"><main class="login-shell"><a class="brand" href="index.html"><span class="brand-mark">J</span><span>JDNEXA <small>ADMIN</small></span></a><section class="login-card"><span class="eyebrow">ESPACE PRIVÉ DE GESTION</span><h1>Administration</h1><p class="muted">Saisissez votre adresse e-mail. Vous recevrez un lien sécurisé pour ouvrir votre espace.</p><form id="login-form"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="username" required><button class="primary full" id="login-btn">Recevoir mon lien de connexion</button><p id="login-message" class="message" role="status"></p></form><p class="security-note">Accès réservé aux comptes autorisés par JDNEXA.</p></section><footer>JDNEXA ADMIN · JDN Agency</footer></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
(()=>{const form=document.querySelector("#login-form"),msg=document.querySelector("#login-message"),btn=document.querySelector("#login-btn");let sb;try{sb=window.requireSupabase()}catch(e){msg.textContent=e.message;return}
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Envoi du lien sécurisé…";btn.disabled=true;try{const {error}=await sb.auth.signInWithOtp({email:form.email.value.trim(),options:{emailRedirectTo:location.origin+"/admin-portal/admin.html",shouldCreateUser:false}});if(error)throw error;msg.textContent="Un lien de connexion a été envoyé à cette adresse. Ouvre l’e-mail sur cet appareil pour accéder à l’administration.";form.reset();}catch(err){msg.textContent=err.message||"Impossible d’envoyer le lien.";btn.disabled=false;}});
})();</script></body></html>
